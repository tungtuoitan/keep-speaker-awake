[package]
name = "keep-speaker-awake"
version = "0.2.0"
edition = "2021"
description = "Keep a Bluetooth speaker from auto-powering-off and reconnect it automatically (Windows)"
license = "MIT"
repository = "https://github.com/tungtuoitan/keep-speaker-awake"
readme = "README.md"
keywords = ["bluetooth", "speaker", "windows", "a2dp"]

[dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Devices_Bluetooth",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_System_Console",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
